[project]
name = "nebula-ticket-classifier"
version = "0.1.0"
description = "AI ticket classifier MVP for Nebula Support"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort (сортування імпортів)
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"